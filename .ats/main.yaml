# app-test-suite (ATS >= 1.0) config. Consumed by the generated
# `run-tests-with-ats` CircleCI job (execute-chart-tests), which creates the
# kind cluster and hands ATS its kubeconfig; ATS installs the chart with Helm.
#
# This chart renders nothing with default values (the `mcpServers` list is
# empty), so the smoke test installs an empty release on kind -- it validates
# that the packaged chart applies cleanly on a real cluster. functional and
# upgrade steps are skipped (no functional tests defined yet).
app-tests-app-config-file: tests/test-values.yaml
app-tests-deploy-namespace: agent-platform-mcps

skip-steps: [functional,upgrade]

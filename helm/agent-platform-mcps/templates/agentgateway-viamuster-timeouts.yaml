{{- if and .Values.agentgateway.enabled .Values.agentgateway.viaMuster }}
{{- $t := .Values.agentgateway.viaMusterTimeouts }}
# Upstream timeouts for the muster target. agentgateway's default upstream
# request timeout is shorter than muster's per-server timeouts (an MCPServer's
# spec.timeout goes up to 300 s), so without this policy a long-running
# tools/call is cut with "upstream call timeout" while the backend completes.
# Attached via sectionName, the way the exchange policies attach per target.
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: {{ include "name" . }}-timeouts
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "labels.common" . | nindent 4 }}
spec:
  targetRefs:
    - group: agentgateway.dev
      kind: AgentgatewayBackend
      name: {{ include "name" . }}
      sectionName: muster
  backend:
    http:
      requestTimeout: {{ required "agentgateway.viaMuster: true requires agentgateway.viaMusterTimeouts.request" $t.request | quote }}
      connectTimeout: {{ required "agentgateway.viaMuster: true requires agentgateway.viaMusterTimeouts.connect" $t.connect | quote }}
{{- end }}

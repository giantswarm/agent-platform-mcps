{{- if and .Values.agentgateway.enabled .Values.agentgateway.viaMuster }}
{{- $t := .Values.agentgateway.viaMusterTimeouts }}
# Upstream timeouts for the muster target. The request deadline is
# agentgateway's limit for muster's response to start: without this policy
# agentgateway's shorter default cuts a tools/call that answers late with
# "upstream call timeout" while the backend completes. muster starts the
# response with the answer, or with the event stream at the first progress
# notification, both within an MCPServer's spec.timeout (up to 300 s); a call
# kept alive by progress past that (spec.progress.maxDuration) streams and is
# not bounded by this deadline.
# Attached via sectionName, the way the exchange policies attach per target.
# The CRD declares the request deadline under spec.backend.http and the
# connect deadline under spec.backend.tcp; a field rendered elsewhere is pruned
# by one API server and refused by another (server-side apply), never applied.
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: {{ include "name" . }}-timeouts
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "labels.common" . | nindent 4 }}
spec:
  targetRefs:
    - group: agentgateway.dev
      kind: AgentgatewayBackend
      name: {{ include "name" . }}
      sectionName: muster
  backend:
    http:
      requestTimeout: {{ required "agentgateway.viaMuster: true requires agentgateway.viaMusterTimeouts.request" $t.request | quote }}
    tcp:
      connectTimeout: {{ required "agentgateway.viaMuster: true requires agentgateway.viaMusterTimeouts.connect" $t.connect | quote }}
{{- end }}

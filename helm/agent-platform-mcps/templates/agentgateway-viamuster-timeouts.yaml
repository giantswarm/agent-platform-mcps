{{- if and .Values.agentgateway.enabled .Values.agentgateway.viaMuster }}
{{- $t := .Values.agentgateway.viaMusterTimeouts }}
# Upstream timeouts for the muster target. muster bounds a tools/call itself:
# an MCPServer's spec.timeout (up to 300 s) is the idle cut, restarted by each
# progress notification up to spec.progress.maxDuration (at most 3600 s). The
# request deadline here is the outer ceiling and must cover that maximum;
# below it, agentgateway cuts a call muster keeps alive with "upstream call
# timeout" while the backend completes. agentgateway has no per-request idle
# timeout, so the cut of a silent call stays muster's.
# Attached via sectionName, the way the exchange policies attach per target.
# The CRD declares the request deadline under spec.backend.http and the
# connect deadline under spec.backend.tcp; a field rendered elsewhere is pruned
# by one API server and refused by another (server-side apply), never applied.
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: {{ include "name" . }}-timeouts
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "labels.common" . | nindent 4 }}
spec:
  targetRefs:
    - group: agentgateway.dev
      kind: AgentgatewayBackend
      name: {{ include "name" . }}
      sectionName: muster
  backend:
    http:
      requestTimeout: {{ required "agentgateway.viaMuster: true requires agentgateway.viaMusterTimeouts.request" $t.request | quote }}
    tcp:
      connectTimeout: {{ required "agentgateway.viaMuster: true requires agentgateway.viaMusterTimeouts.connect" $t.connect | quote }}
{{- end }}

# Values for the agent-platform-mcps chart.
#
# This chart renders a single, vendor-neutral list of MCP servers (`mcpServers`)
# into the CR family selected by the toggles below:
#
#   * muster        -> muster.giantswarm.io/v1alpha1 MCPServer (default on)
#   * agentgateway  -> agentgateway.dev/v1alpha1 AgentgatewayBackend + HTTPRoutes +
#                      BackendTrafficPolicy + OAuth discovery (default off)

# -- Render muster MCPServer CRs from the mcpServers list.
muster:
  # -- Enable muster MCPServer rendering.
  enabled: true
  # -- Groups that muster exposes as instance families. A server whose `group`
  # is listed here gets a muster `family` block; unlisted groups are singletons.
  families:
    kubernetes:
      instanceArg: management_cluster
    prometheus:
      instanceArg: management_cluster
    capi:
      instanceArg: management_cluster

# -- Render agentgateway CRs for the via-muster topology.
# When viaMuster is true the traffic flow is:
#   client → agentgateway → muster → N MCP servers
# agentgateway becomes the single MCP choke point for observability (per-call
# metrics, traces, access logs). muster keeps all per-server connection logic,
# OAuth, and RFC 8693 token exchange.
agentgateway:
  # -- Enable agentgateway CR rendering.
  enabled: false
  # -- Route all MCP traffic through muster as a single backend instead of
  # connecting agentgateway directly to each server. Requires muster.enabled: true.
  viaMuster: false
  # -- In-cluster muster aggregator endpoint. Required when viaMuster: true.
  # Typically http://<release>-muster.<namespace>.svc.cluster.local:8090/mcp
  musterUrl: ""
  # -- Name of the agentgateway data-plane Gateway CR in the release namespace.
  # An HTTPRoute is rendered on this Gateway connecting it to the AgentgatewayBackend.
  # The public ingress HTTPRoute (cluster ingress → agentgateway Service) is
  # owned by the agent-platform umbrella chart (gateway.httpRoute).
  gateway:
    name: agentgateway
  # -- OAuth discovery and edge validation mode.
  #
  # muster serves all OAuth discovery paths natively (/.well-known/oauth-protected-resource,
  # /.well-known/oauth-authorization-server, etc.) because clients dial the muster hostname
  # directly. No proxy HTTPRoute is needed.
  #
  # passthrough (current default): agentgateway forwards all tokens to muster
  #   without inspecting them. muster is the sole enforcement point.
  #
  # validate: additionally renders an AgentgatewayPolicy with jwtAuthentication
  #   pointing at the JWKS endpoint, attached to this chart's MCP HTTPRoute (not the
  #   shared Gateway, which also carries other charts' routes). agentgateway validates
  #   the inbound token before forwarding. muster still validates downstream (defence in depth).
  #   Validates against Dex's JWKS (the token issuer); muster never signs tokens.
  #   agentgateway v1.2.1+ serves /.well-known/oauth-protected-resource and emits
  #   WWW-Authenticate without a provider preset — no blocker.
  oauthMode: passthrough  # @schema enum: [validate, passthrough]
  # -- JWT validation config — only used when oauthMode: validate.
  # agentgateway fetches the JWKS from the named Kubernetes Service to verify
  # inbound tokens locally (cached after first fetch; no per-request network call).
  # Points at Dex, the token issuer (muster never signs tokens).
  jwt:
    # -- OIDC issuer URL. Must match the `iss` claim in inbound tokens.
    # Dex: https://dex.<codename>.<base>
    issuer: ""
    # -- Kubernetes Service reference for the JWKS endpoint.
    jwksBackendRef:
      name: dex
      namespace: giantswarm
      port: 5556
    # -- Path on the JWKS Service where public keys are served.
    # Dex: /keys
    jwksPath: /keys
    # -- Expected `aud` claim values. The downstream server's expected audience
    # (e.g. dex-k8s-authenticator).
    audiences:
      - dex-k8s-authenticator
    # -- Additional JWT providers, rendered verbatim into the
    # jwtAuthentication providers list after the primary provider above.
    # Use to accept tokens from a second issuer at the edge, e.g. Dex ID tokens
    # from a different connector alongside the primary Dex provider.
    # Cross-namespace jwks backendRefs require a ReferenceGrant in the target
    # namespace (kind AgentgatewayPolicy, group agentgateway.dev).
    # Example:
    #   extraProviders:
    #     - issuer: https://dex.<codename>.<base>
    #       audiences: [<backstage-dex-client-id>]
    #       jwks:
    #         remote:
    #           backendRef: {name: dex, namespace: giantswarm, port: 5556}
    #           jwksPath: /keys
    extraProviders: []
  # -- Outbound token-exchange broker for auth.mode=exchange servers.
  # One AgentgatewayPolicy per exchange target is rendered, delegating
  # cross-cluster token exchange to this ext_authz service. Not used when
  # viaMuster: true (muster handles all exchange internally).
  tokenExchange:
    broker:
      kind: Service  # Service | Backend
      name: muster-token-exchange-broker
      namespace: muster
      port: 8080
      protocol: grpc  # grpc | http

# -- Defaults applied to every mcpServers entry unless overridden per entry.
defaults:
  # -- Start connections automatically when muster starts.
  autoStart: true
  # -- MCP transport protocol.
  transport: streamable-http
  # -- Audiences required at the upstream for oauth-authenticated servers.
  audiences:
    - dex-k8s-authenticator

# @schema additionalProperties: {type: object, additionalProperties: false, required: [tokenEndpoint], properties: {tokenEndpoint: {type: string}, expectedIssuer: {type: string}, connectorId: {type: string}, scopes: {type: string}, credentialsSecret: {type: object, additionalProperties: false, properties: {name: {type: string}, namespace: {type: string}, clientIdKey: {type: string}, clientSecretKey: {type: string}}}}}
# -- Identity providers, defined once and referenced by servers via auth.provider.
# Multiple servers on the same cluster share one entry instead of repeating
# token-exchange config.
#
# expectedIssuer pins the `iss` claim of the exchanged token. It is required
# when tokenEndpoint points at a transport-only proxy (e.g. a tunnelport
# `:8443` in-cluster Service) whose URL differs from the remote Dex issuer:
# the minted token still carries the public Dex issuer, so muster must be told
# what to expect. When tokenEndpoint is the real public Dex URL it can be
# omitted (muster derives the issuer from tokenEndpoint).
#
# Example (tunneled):
#   cluster-b:
#     tokenEndpoint: https://dex-cluster-b.agent-platform.svc.cluster.local:8443/token
#     expectedIssuer: https://dex.cluster-b.example.com
#     connectorId: giantswarm-simple-oidc
#     scopes: openid profile email groups
#     credentialsSecret:
#       name: cluster-b-token-exchange-credentials
#       namespace: muster        # optional; defaults to the release namespace
#       clientIdKey: client-id
#       clientSecretKey: client-secret
identityProviders: {}

# @schema item: object; itemRequired: [cluster, group, url]; itemProperties: {cluster: {type: string}, group: {type: string}, url: {type: string}, name: {type: string}, namespace: {type: string}, transport: {type: string}, autoStart: {type: boolean}, timeout: {type: integer}, toolPrefix: {type: string}, auth: {type: object, properties: {mode: {type: string, enum: [none, oauth, forward, exchange]}, provider: {type: string}, audiences: {type: array, items: {type: string}}, authorizationServer: {type: object, required: [issuer], properties: {issuer: {type: string}, authorizationEndpoint: {type: string}, tokenEndpoint: {type: string}, scopes: {type: string}, clientCredentialsSecretRef: {type: object, required: [name], properties: {name: {type: string}, namespace: {type: string}, clientIdKey: {type: string}, clientSecretKey: {type: string}}}, grantScope: {type: string, enum: [session, subject]}}}}}}
# -- Flat list of MCP servers. Required fields per entry: cluster, group, url.
# Optional: name (default <cluster>-mcp-<group>), namespace (default: the
# release namespace), transport, autoStart, timeout, toolPrefix, auth. The
# entry schema is closed: a key the chart does not read fails the values
# check instead of being dropped silently.
#
# auth.mode selects how muster authenticates to the server: none, oauth
# (muster runs its own OAuth login against the server's authorization server
# and holds the person's grant), forward (the caller's Dex token, same-cluster
# only) or exchange (RFC 8693 via identityProviders). For mode oauth,
# auth.authorizationServer pins an authorization server muster can neither
# discover nor register with (GitHub) -- rendered into
# spec.auth.authorizationServer as is; needs the muster chart >= 5.8.0, an
# older CRD prunes the pin silently. issuer is required; authorizationEndpoint
# and tokenEndpoint go together (both or neither, the CRD's rule); grantScope
# is session (default) or subject; clientCredentialsSecretRef.namespace
# defaults to the MCPServer's namespace. Keys other than these fail the render.
#
# Example entries:
#   # Same-cluster server, the Dex token forwarded as-is. The backend
#   # validates it against Dex's JWKS; muster is not an issuer.
#   - cluster: graveler
#     group: kubernetes
#     url: https://mcp-kubernetes.graveler.example.com/mcp
#     auth:
#       mode: forward
#
#   # Remote cluster server, RFC 8693 token exchange via identityProviders:
#   - cluster: gazelle
#     group: kubernetes
#     url: https://mcp-kubernetes.gazelle.example.com/mcp
#     auth:
#       mode: exchange
#       provider: gazelle          # ref into identityProviders above
#
#   # Unauthenticated server:
#   - cluster: graveler
#     group: prometheus
#     url: https://mcp-prometheus.graveler.example.com/mcp
#     auth:
#       mode: none
#
#   # Hosted server whose authorization server publishes no discovery document
#   # and registers no clients (GitHub): pin it. muster identifies with the
#   # pre-registered client from the Secret (keys client-id / client-secret)
#   # and files the grant under the person, so one connect serves all of
#   # their sessions. `name` keeps the server's name stable for consumers
#   # that address it (the Dev Portal's plans.muster.server).
#   - cluster: gazelle
#     group: github
#     name: github
#     url: https://api.githubcopilot.com/mcp/
#     timeout: 120
#     toolPrefix: github
#     auth:
#       mode: oauth
#       authorizationServer:
#         issuer: https://github.com/login/oauth
#         authorizationEndpoint: https://github.com/login/oauth/authorize
#         tokenEndpoint: https://github.com/login/oauth/access_token
#         scopes: "repo read:org project"
#         clientCredentialsSecretRef:
#           name: github-oauth-client
#           namespace: agent-platform   # optional; defaults to the server's namespace
#         grantScope: subject           # session (default) | subject
mcpServers: []

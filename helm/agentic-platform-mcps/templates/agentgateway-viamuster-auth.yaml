{{- if and .Values.agentgateway.enabled .Values.agentgateway.viaMuster }}
{{- $host := required "agentgateway.viaMuster requires agentgateway.host" .Values.agentgateway.host }}
{{- $musterHost := required "agentgateway.viaMuster requires agentgateway.musterHost" .Values.agentgateway.musterHost }}
{{- /*
Both modes always render the directResponse HTTPRouteFilter + HTTPRoute to serve a
corrected /.well-known/oauth-protected-resource doc at the agentgateway hostname.
This is always necessary because muster's own doc advertises resource=muster-host,
which mismatches the URL the client dialled (agentgateway-host).

oauthMode: passthrough — metadata shim only; agentgateway forwards tokens to muster
  without validating them. muster is the sole enforcement point.
oauthMode: validate — metadata shim PLUS an AgentgatewayPolicy that validates JWTs at
  the edge using generic jwtAuthentication.providers[] (any OIDC issuer, no Auth0/
  Keycloak preset required). agentgateway rejects invalid tokens before they reach
  muster; muster still validates as a second layer.
*/}}
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: HTTPRouteFilter
metadata:
  name: {{ include "name" . }}-prm
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "labels.common" . | nindent 4 }}
spec:
  directResponse:
    statusCode: 200
    contentType: application/json
    body:
      type: Inline
      inline: |
        {"resource":"https://{{ $host }}/mcp","authorization_servers":["{{ $musterHost }}"],"bearer_methods_supported":["header"]}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "name" . }}-prm
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "labels.common" . | nindent 4 }}
spec:
  hostnames:
    - {{ $host | quote }}
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ .Values.agentgateway.ingressGateway.name | quote }}
      namespace: {{ .Values.agentgateway.ingressGateway.namespace | quote }}
  rules:
    - matches:
        - path:
            type: Exact
            value: /.well-known/oauth-protected-resource/mcp
        - path:
            type: Exact
            value: /.well-known/oauth-protected-resource
      filters:
        - type: ExtensionRef
          extensionRef:
            group: gateway.envoyproxy.io
            kind: HTTPRouteFilter
            name: {{ include "name" . }}-prm
{{- if eq .Values.agentgateway.oauthMode "validate" }}
{{- $jwt := .Values.agentgateway.jwt }}
{{- $issuer := required "agentgateway.oauthMode=validate requires agentgateway.jwt.issuer" $jwt.issuer }}
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: {{ include "name" . }}-auth
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "labels.common" . | nindent 4 }}
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ .Values.agentgateway.gateway.name | quote }}
  traffic:
    jwtAuthentication:
      providers:
        - issuer: {{ $issuer | quote }}
          jwks:
            remote:
              backendRef:
                name: {{ $jwt.jwksBackendRef.name | quote }}
                namespace: {{ $jwt.jwksBackendRef.namespace | quote }}
                port: {{ $jwt.jwksBackendRef.port }}
              jwksPath: {{ $jwt.jwksPath | quote }}
          {{- with $jwt.audiences }}
          audiences:
            {{- toYaml . | nindent 12 }}
          {{- end }}
{{- else if ne .Values.agentgateway.oauthMode "passthrough" }}
{{- fail (printf "agentgateway.oauthMode must be 'validate' or 'passthrough', got %q" .Values.agentgateway.oauthMode) }}
{{- end }}
{{- end }}

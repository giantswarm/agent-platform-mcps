{{- if and .Values.agentgateway.enabled .Values.agentgateway.viaMuster }}
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: {{ include "name" . }}-ingress
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "labels.common" . | nindent 4 }}
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: {{ include "name" . }}-ingress
  timeout:
    http:
      # Disable the default Envoy timeout so long-lived SSE / streaming MCP
      # connections are not killed. A route-scoped BackendTrafficPolicy also
      # takes precedence over the cluster-wide gateway error-page override,
      # which would otherwise strip the WWW-Authenticate header from 401
      # responses (breaking MCP OAuth client discovery).
      requestTimeout: "0s"
{{- end }}

{{- if and .Values.agentgateway.enabled .Values.agentgateway.viaMuster }}
{{- $gatewayName := required "agentgateway.viaMuster requires agentgateway.gateway.name" .Values.agentgateway.gateway.name }}
# Route the agentgateway data-plane Gateway to the AgentgatewayBackend.
# The public ingress HTTPRoute (cluster ingress gateway -> agentgateway Service)
# is owned by the agentic-platform umbrella chart (gateway.httpRoute).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "labels.common" . | nindent 4 }}
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ $gatewayName | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: agentgateway.dev
          kind: AgentgatewayBackend
          name: {{ include "name" . }}
{{- end }}

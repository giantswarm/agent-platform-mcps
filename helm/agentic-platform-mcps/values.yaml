# Values for the agentic-platform-mcps chart.
#
# This chart renders a single, vendor-neutral list of MCP servers (`mcpServers`)
# into the CR family selected by the toggles below:
#
#   * muster        -> muster.giantswarm.io/v1alpha1 MCPServer (default on)
#   * agentgateway  -> agentgateway.dev/v1alpha1 AgentgatewayBackend + HTTPRoutes +
#                      BackendTrafficPolicy + OAuth discovery (default off)

# -- Render muster MCPServer CRs from the mcpServers list.
muster:
  # -- Enable muster MCPServer rendering.
  enabled: true
  # -- Groups that muster exposes as instance families. A server whose `group`
  # is listed here gets a muster `family` block; unlisted groups are singletons.
  families:
    kubernetes:
      instanceArg: management_cluster
    prometheus:
      instanceArg: management_cluster

# -- Render agentgateway CRs for the via-muster topology.
# When viaMuster is true the traffic flow is:
#   client → agentgateway → muster → N MCP servers
# agentgateway becomes the single MCP choke point for observability (per-call
# metrics, traces, access logs). muster keeps all per-server connection logic,
# OAuth, and RFC 8693 token exchange.
agentgateway:
  # -- Enable agentgateway CR rendering.
  enabled: false
  # -- Route all MCP traffic through muster as a single backend instead of
  # connecting agentgateway directly to each server. Requires muster.enabled: true.
  viaMuster: false
  # -- In-cluster muster aggregator endpoint. Required when viaMuster: true.
  # Typically http://<release>-muster.<namespace>.svc.cluster.local:8090/mcp
  musterUrl: ""
  # -- Public hostname of the agentgateway endpoint. Becomes the MCP resource
  # identifier in OAuth protected-resource metadata (RFC 9728). Must match the
  # URL MCP clients dial exactly. Required when viaMuster: true.
  host: ""
  # -- Public base URL of muster, advertised as the OAuth authorization server
  # in the protected-resource metadata. Clients perform DCR and authorization
  # at this URL. Required when viaMuster: true.
  musterHost: ""
  # -- Name of the agentgateway data-plane Gateway CR in the release namespace.
  # An HTTPRoute is rendered on this Gateway connecting it to the AgentgatewayBackend.
  # The public ingress HTTPRoute (cluster ingress → agentgateway Service) is
  # owned by the agentic-platform umbrella chart (gateway.httpRoute).
  gateway:
    name: agentgateway
  # -- Cluster ingress Gateway where the well-known OAuth proxy HTTPRoute attaches.
  # Routes /.well-known/oauth-{protected-resource,authorization-server} and
  # /.well-known/openid-configuration from agentgateway-host to the muster Service.
  # Required because some MCP SDKs fetch these paths at the resource server hostname
  # directly, not only from the authorization_servers URL in the protected-resource doc.
  ingressGateway:
    name: giantswarm-default
    namespace: envoy-gateway-system
  # -- OAuth discovery and edge validation mode.
  #
  # Both modes always render an HTTPRoute proxying OAuth discovery paths from
  # agentgateway-host to muster. muster serves the correct content because
  # muster.oauth.server.resourceIdentifier is set to agentgateway-host/mcp
  # in shared-configs, making muster advertise the agentgateway URL as the
  # protected resource in its WWW-Authenticate challenge and well-known docs.
  #
  # passthrough (current default): agentgateway forwards all tokens to muster
  #   without inspecting them. muster is the sole enforcement point. Use this
  #   until oauthMode: validate is unblocked (see below).
  #
  # validate (preferred, pending): additionally renders an AgentgatewayPolicy
  #   with generic jwtAuthentication.providers[] (any OIDC issuer; no
  #   Auth0/Keycloak preset required). agentgateway validates the inbound token
  #   at the edge before forwarding. muster still validates downstream (defence
  #   in depth). Token exchange is unaffected: agentgateway only sees the inbound
  #   user token; muster performs all RFC 8693 exchanges internally.
  #
  #   BLOCKER: agentgateway's jwtAuthentication without an mcp.provider preset
  #   (Auth0|Keycloak enum) does not emit the MCP-specific WWW-Authenticate
  #   challenge that MCP SDKs need to bootstrap the OAuth flow on first contact.
  #   Clients hit agentgateway's raw 401 and fail to parse it as an OAuth error.
  #   Fix requires either:
  #     a) agentgateway adds generic OIDC as a supported mcp.provider (upstream FR)
  #     b) muster PR #757 lands + enableJWTMode: true: muster signs its own JWTs,
  #        agentgateway validates against muster's JWKS (same namespace, no
  #        ReferenceGrant), and the -prm proxy route handles discovery for clients
  #        that fall back to path-based discovery (RFC 9728) instead of the header.
  oauthMode: passthrough  # @schema enum: [validate, passthrough]
  # -- JWT validation config — only used when oauthMode: validate.
  # agentgateway fetches the JWKS from the named Kubernetes Service to verify
  # inbound tokens locally (cached after first fetch; no per-request network call).
  # With muster JWT mode (enableJWTMode: true), point this at muster's own JWKS
  # (name: agentic-platform-muster, namespace: agentic-platform, port: 8090,
  # jwksPath: /.well-known/jwks.json) — same namespace, no ReferenceGrant needed.
  jwt:
    # -- OIDC issuer URL. Must match the `iss` claim in inbound tokens.
    # With muster JWT mode: https://muster.<codename>.<base>
    # With Dex direct:      https://dex.<codename>.<base>
    issuer: ""
    # -- Kubernetes Service reference for the JWKS endpoint.
    jwksBackendRef:
      name: dex
      namespace: giantswarm
      port: 5556
    # -- Path on the JWKS Service where public keys are served.
    # Dex: /keys   |   muster JWT mode: /.well-known/jwks.json
    jwksPath: /keys
    # -- Expected `aud` claim values. Must match muster's resourceIdentifier
    # (agentgateway-host/mcp) when using muster JWT mode, or the downstream
    # server's expected audience when using Dex directly.
    audiences:
      - dex-k8s-authenticator
  # -- Outbound token-exchange broker for auth.mode=exchange servers.
  # One AgentgatewayPolicy per exchange target is rendered, delegating
  # cross-cluster token exchange to this ext_authz service. Not used when
  # viaMuster: true (muster handles all exchange internally).
  tokenExchange:
    broker:
      kind: Service  # Service | Backend
      name: muster-token-exchange-broker
      namespace: muster
      port: 8080
      protocol: grpc  # grpc | http

# -- Defaults applied to every mcpServers entry unless overridden per entry.
defaults:
  # -- Start connections automatically when muster starts.
  autoStart: true
  # -- MCP transport protocol.
  transport: streamable-http
  # -- Audiences required at the upstream for oauth-authenticated servers.
  audiences:
    - dex-k8s-authenticator

# -- Identity providers, defined once and referenced by servers via auth.provider.
# Multiple servers on the same cluster share one entry instead of repeating
# token-exchange config.
#
# Example:
#   cluster-b:
#     tokenEndpoint: https://dex.cluster-b.example.com/token
#     connectorId: giantswarm-simple-oidc
#     scopes: openid profile email groups
#     credentialsSecret:
#       name: cluster-b-token-exchange-credentials
#       namespace: muster        # optional; defaults to the release namespace
#       clientIdKey: client-id
#       clientSecretKey: client-secret
identityProviders: {}

# -- Flat list of MCP servers. Required fields per entry: cluster, group, url.
#
# Example entries:
#   # Same-cluster server, token forwarded as-is:
#   - cluster: graveler
#     group: kubernetes
#     url: https://mcp-kubernetes.graveler.example.com/mcp
#     auth:
#       mode: forward
#
#   # Remote cluster server, RFC 8693 token exchange via identityProviders:
#   - cluster: gazelle
#     group: kubernetes
#     url: https://mcp-kubernetes.gazelle.example.com/mcp
#     auth:
#       mode: exchange
#       provider: gazelle          # ref into identityProviders above
#
#   # Unauthenticated server:
#   - cluster: graveler
#     group: prometheus
#     url: https://mcp-prometheus.graveler.example.com/mcp
#     auth:
#       mode: none
mcpServers: []

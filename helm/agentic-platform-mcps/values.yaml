# Values for the agentic-platform-mcps chart.
#
# This chart renders a single, vendor-neutral list of MCP servers (`mcpServers`)
# into the CR family selected by the toggles below:
#
#   * muster        -> muster.giantswarm.io/v1alpha1 MCPServer (default on)
#   * agentgateway  -> agentgateway.dev/v1alpha1 AgentgatewayBackend + HTTPRoutes +
#                      BackendTrafficPolicy + OAuth discovery (default off)
#
# The input is abstract: it does NOT mirror any one CRD. The chart owns the
# translation into each backend's CRD. The CRDs themselves are NOT shipped here.

# Render muster MCPServer CRs.
muster:
  enabled: true
  # Groups that muster exposes as instance families (the same logical server
  # aggregated across many clusters). A server whose `group` is listed here gets
  # a muster `family` block; groups not listed are rendered as singletons.
  families:
    kubernetes:
      instanceArg: management_cluster
    prometheus:
      instanceArg: management_cluster

# Render agentgateway configuration CRs (AgentgatewayBackend, HTTPRoutes,
# BackendTrafficPolicy, and OAuth discovery). When viaMuster is false, also
# renders per-target AgentgatewayPolicy for token exchange.
agentgateway:
  enabled: false
  # Front muster instead of connecting to each server directly. When true, the
  # AgentgatewayBackend gets a SINGLE target pointing at muster's aggregator MCP
  # endpoint, so traffic flows client -> agentgateway -> muster -> servers.
  # muster keeps doing per-server connection + auth + RFC 8693 exchange, and
  # agentgateway becomes the single MCP choke point for observability (metrics /
  # traces / access logs of every tool call). The per-target exchange policies
  # and the tokenExchange broker below are NOT used in this mode. Requires
  # muster.enabled: true.
  viaMuster: false
  # muster aggregator MCP endpoint (in-cluster). Required when viaMuster: true.
  # e.g. http://agentic-platform-muster.agentic-platform.svc.cluster.local:8090/mcp
  musterUrl: ""

  # Public hostname of the agentgateway endpoint. Used as the MCP resource
  # identifier in OAuth protected-resource metadata (RFC 9728). Required when
  # viaMuster: true. e.g. agentgateway.<codename>.<base>
  host: ""

  # Public base URL of muster, advertised as the OAuth authorization server in
  # the agentgateway protected-resource metadata. Clients (Claude.ai, MCP SDKs)
  # are directed here to perform DCR / authorization. Required when viaMuster: true.
  # e.g. https://muster.<codename>.<base>
  musterHost: ""

  # Name of the agentgateway data-plane Gateway CR in the release namespace.
  # The chart renders an HTTPRoute on this Gateway to connect it to the
  # AgentgatewayBackend. The public ingress HTTPRoute (cluster ingress gateway
  # -> agentgateway Service) is owned by the agentic-platform umbrella chart.
  gateway:
    name: agentgateway

  # Cluster ingress Gateway used in oauthMode: passthrough only. The
  # directResponse HTTPRoute for /.well-known/oauth-protected-resource must
  # attach to the ingress gateway (not the agentgateway Gateway) so it can
  # short-circuit before the request reaches agentgateway and is forwarded to
  # muster (which would serve its own resource identifier, not agentgateway's).
  # Not used in oauthMode: validate.
  ingressGateway:
    name: giantswarm-default
    namespace: envoy-gateway-system

  # OAuth discovery mode for the agentgateway hostname. Controls how clients
  # learn the correct resource identifier and authorization server.
  #
  # validate (recommended): an AgentgatewayPolicy attaches JWT validation (Dex)
  #   to the agentgateway Gateway and configures it to serve the correct
  #   protected-resource metadata doc (resource=agentgateway-host/mcp,
  #   authorization_servers=[muster-host]). The WWW-Authenticate header on 401
  #   responses is correct and header-first MCP clients work without fallback.
  #   Requires jwt.* and a ReferenceGrant in the JWKS service's namespace
  #   (platform prerequisite, not rendered by this chart).
  #
  # passthrough: agentgateway passes tokens straight to muster without
  #   validating them. A directResponse HTTPRouteFilter at the ingress Gateway
  #   serves the corrected protected-resource metadata doc. The WWW-Authenticate
  #   header may be stripped by cluster-level error-page overrides, so clients
  #   fall back to path-based discovery (RFC 9728). Use when validate is not
  #   available (e.g. missing ReferenceGrant or unsupported JWKS backendRef).
  oauthMode: validate

  # JWT validation config (oauthMode: validate only). agentgateway fetches the
  # JWKS from the named Kubernetes Service to verify inbound tokens. A
  # ReferenceGrant in jwksBackendRef.namespace must allow agentgateway-policy
  # to reference that Service (platform prerequisite, not rendered here).
  jwt:
    issuer: ""
    jwksBackendRef:
      name: dex
      namespace: giantswarm
      port: 5556
    jwksPath: /keys
    audiences:
      - dex-k8s-authenticator

  # Outbound cross-cluster auth (mode: exchange) is delegated to a muster broker
  # called as an Envoy-style ext_authz service. One per-target policy is rendered
  # for each server with auth.mode=exchange. (Unused when viaMuster: true.)
  tokenExchange:
    broker:
      kind: Service  # Service | Backend
      name: muster-token-exchange-broker
      namespace: muster
      port: 8080
      protocol: grpc  # grpc | http

# Defaults applied to every mcpServers entry unless the entry overrides them.
defaults:
  autoStart: true
  transport: streamable-http
  # Audiences required at the upstream for oauth-authenticated servers.
  audiences:
    - dex-k8s-authenticator

# Identity providers, defined once and referenced by servers via auth.provider.
# Multiple MCP servers sharing a cluster's Dex reference the same entry instead
# of repeating the token-exchange config.
#
# Example:
#   cluster-b:
#     tokenEndpoint: https://dex.cluster-b.example.com/token
#     connectorId: giantswarm-simple-oidc
#     scopes: openid profile email groups
#     credentialsSecret:
#       name: cluster-b-token-exchange-credentials
#       namespace: muster        # optional; defaults to the release namespace
#       clientIdKey: client-id
#       clientSecretKey: client-secret
identityProviders: {}

# Flat list of MCP servers. Required: cluster, group, url.
#
# Example entry:
#   - cluster: cluster-b
#     group: kubernetes            # category; -> muster type label + family lookup
#     name: cluster-b-mcp-kubernetes   # optional; defaults to "<cluster>-mcp-<group>"
#     url: https://example.com/mcp
#     timeout: 30                  # optional
#     toolPrefix: ""               # optional
#     auth:
#       mode: exchange             # none | forward | exchange
#       provider: cluster-b            # ref into identityProviders; required for exchange
#       audiences:                 # optional; overrides defaults.audiences
#         - dex-k8s-authenticator
mcpServers: []

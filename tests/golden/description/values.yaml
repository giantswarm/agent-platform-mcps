# Golden case: the Dev Portal description. The family default
# (muster.families.<group>.description) describes every kubernetes server, a
# per-entry description wins over it, the family default itself is a value
# (prometheus reworded here) and can be emptied (capi), an entry of an unlisted
# group renders none unless it sets one, and an entry's empty description drops
# its family's (cluster-c).
muster:
  families:
    prometheus:
      description: Metrics of the management cluster
    capi:
      description: ""
mcpServers:
  - cluster: cluster-a
    group: kubernetes
    url: http://mcp-kubernetes.mcp-kubernetes.svc:8080/mcp
    auth:
      mode: forward
  - cluster: cluster-b
    group: kubernetes
    description: Resources of cluster-b only
    url: http://mcp-kubernetes.cluster-b.example.com/mcp
    auth:
      mode: forward
  - cluster: cluster-c
    group: kubernetes
    description: ""
    url: http://mcp-kubernetes.cluster-c.example.com/mcp
    auth:
      mode: forward
  - cluster: cluster-a
    group: prometheus
    url: http://mcp-prometheus.mcp-prometheus.svc:8080/mcp
    auth:
      mode: forward
  - cluster: cluster-a
    group: capi
    url: http://mcp-capi.mcp-capi.svc:8080/mcp
    auth:
      mode: forward
  - cluster: cluster-a
    group: github
    name: github
    description: Repositories, issues and pull requests
    url: https://api.githubcopilot.com/mcp/
    auth:
      mode: none
  - cluster: cluster-a
    group: kagi
    name: kagi-search
    url: http://kagi-search.agent-platform.svc:8080/mcp
    auth:
      mode: none

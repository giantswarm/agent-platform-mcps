---
# Source: agent-platform-mcps/templates/muster-mcpserver.yaml
apiVersion: muster.giantswarm.io/v1alpha1
kind: MCPServer
metadata:
  name: cluster-a-mcp-kubernetes
  namespace: agent-platform
  annotations:
    helm.sh/resource-policy: keep
    ui.giantswarm.io/display-name: "Kubernetes"
  labels:
    app: "agent-platform-mcps"
    app.kubernetes.io/name: "agent-platform-mcps"
    app.kubernetes.io/instance: "agent-platform-mcps"
    app.kubernetes.io/managed-by: "Helm"
    app.kubernetes.io/version: "0.0.1"
    application.giantswarm.io/team: "team-bumblebee"
    helm.sh/chart: "agent-platform-mcps-0.5.0"
    muster.giantswarm.io/management-cluster: cluster-a
    muster.giantswarm.io/type: mcp-kubernetes
    agent-platform.giantswarm.io/tool-group: infrastructure
spec:
  autoStart: true
  type: streamable-http
  url: http://mcp-kubernetes.mcp-kubernetes.svc:8080/mcp
  description: "Resources, events and pod logs of a management cluster and the health of its workload clusters, read-only"
  approval:
    rule: Ask
    tools:
      api_resources: Allow
      apply: Ask
      can_i: Allow
      capi_cluster_health: Allow
      capi_get_cluster: Allow
      capi_list_clusters: Allow
      capi_resolve_cluster: Allow
      cluster_health: Allow
      context_get_current: Allow
      context_list: Allow
      context_use: Ask
      create: Ask
      delete: Ask
      describe: Allow
      exec: Ask
      get: Allow
      list: Allow
      list_port_forward_sessions: Allow
      logs: Allow
      patch: Ask
      port_forward: Ask
      scale: Ask
      stop_all_port_forward_sessions: Ask
      stop_port_forward_session: Ask
  auth:
    type: oauth
    forwardToken: true
    requiredAudiences:
      - dex-k8s-authenticator
  family:
    name: kubernetes
    instanceArg: management_cluster
---
# Source: agent-platform-mcps/templates/muster-mcpserver.yaml
apiVersion: muster.giantswarm.io/v1alpha1
kind: MCPServer
metadata:

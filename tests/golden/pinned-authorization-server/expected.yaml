---
# Source: agent-platform-mcps/templates/muster-mcpserver.yaml
apiVersion: muster.giantswarm.io/v1alpha1
kind: MCPServer
metadata:
  name: github
  namespace: agent-platform
  labels:
    app: "agent-platform-mcps"
    app.kubernetes.io/name: "agent-platform-mcps"
    app.kubernetes.io/instance: "agent-platform-mcps"
    app.kubernetes.io/managed-by: "Helm"
    app.kubernetes.io/version: "0.0.1"
    application.giantswarm.io/team: "team-bumblebee"
    helm.sh/chart: "agent-platform-mcps-0.5.0"
    muster.giantswarm.io/management-cluster: gazelle
    muster.giantswarm.io/type: mcp-github
spec:
  autoStart: true
  type: streamable-http
  url: https://api.githubcopilot.com/mcp/
  timeout: 120
  toolPrefix: github
  auth:
    type: oauth
    forwardToken: false
    authorizationServer:
      issuer: https://github.com/login/oauth
      authorizationEndpoint: https://github.com/login/oauth/authorize
      tokenEndpoint: https://github.com/login/oauth/access_token
      scopes: "repo read:org project"
      clientCredentialsSecretRef:
        name: github-oauth-client
        namespace: agent-platform
      grantScope: subject

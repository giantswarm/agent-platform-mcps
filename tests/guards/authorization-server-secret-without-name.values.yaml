# expect: auth.authorizationServer.clientCredentialsSecretRef.name is required
mcpServers:
  - cluster: gazelle
    group: github
    url: https://api.githubcopilot.com/mcp/
    auth:
      mode: oauth
      authorizationServer:
        issuer: https://github.com/login/oauth
        clientCredentialsSecretRef:
          namespace: agent-platform
